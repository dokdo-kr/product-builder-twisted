<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 뭐 먹지?</title>
  <link href='/style.css' rel='stylesheet'>
</head>
<body>
  <div class="app-container">
    <h1>오늘 뭐 먹지?</h1>

    <div class="selection-container">
      <h2>1. 식사 시간을 선택하세요.</h2>
      <div class="options-group" id="meal-time-options">
        <label><input type="radio" name="mealTime" value="아침"> 아침</label>
        <label><input type="radio" name="mealTime" value="점심"> 점심</label>
        <label><input type="radio" name="mealTime" value="저녁"> 저녁</label>
      </div>
    </div>

    <div class="selection-container">
      <h2>2. 인원을 선택하세요.</h2>
      <div class="options-group" id="group-size-options">
        <label><input type="radio" name="groupSize" value="혼자"> 혼자</label>
        <label><input type="radio" name="groupSize" value="여럿이서"> 여럿이서</label>
      </div>
    </div>

    <button id="recommend-button">메뉴 추천받기</button>

    <div id="result-container">
      <h2>추천 메뉴</h2>
      <p id="result-text">여기에 추천 메뉴가 표시됩니다.</p>
    </div>
  </div>
  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
